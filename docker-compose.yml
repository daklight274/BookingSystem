version: "3.9"
services:
   rabbitmq:
    image: rabbitmq:3-management
    container_name: booking-rabbitmq
    ports:
      - "5672:5672"    # AMQP port - services kết nối vào đây
      - "15672:15672"  # Management UI - xem queues tại localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

   db-room:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: booking-db-room
    restart: unless-stopped
    ports:
      - "1431:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "@??Anhquang4mat2002??@"   # min 8 ký tự, có chữ hoa + số + ký tự đặc biệt
      MSSQL_PID: "Developer"                    # bản miễn phí, không dùng production
    volumes:
      - db-room-data:/var/opt/mssql 

   db-booking:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: booking-db-booking
    restart: unless-stopped
    ports:
      - "1432:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "@??Anhquang4mat2002??@"   # min 8 ký tự, có chữ hoa + số + ký tự đặc biệt
      MSSQL_PID: "Developer"                    # bản miễn phí, không dùng production
    volumes:
      - db-booking-data:/var/opt/mssql

   db-payment:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: booking-db-payment
    restart: unless-stopped
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "@??Anhquang4mat2002??@"   # min 8 ký tự, có chữ hoa + số + ký tự đặc biệt
      MSSQL_PID: "Developer"                    # bản miễn phí, không dùng production
    volumes:
      - db-payment-data:/var/opt/mssql

   # ── Application Services ───────────────────────
   room-service:
    build:
      context: .
      dockerfile: src/Services/BookingSystem.RoomService/Dockerfile
    container_name: booking-room-service
    ports: ["5001:80"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__RoomDb: "Server=db-room;Database=RoomServiceDb;User Id=sa;Password=@??Anhquang4mat2002??@;TrustServerCertificate=True"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
    depends_on:
      rabbitmq:
        condition: service_healthy
      db-room:
        condition: service_started

   booking-service:
    build:
      context: .
      dockerfile: src/Services/BookingSystem.BookingService/Dockerfile
    container_name: booking-booking-service
    ports: ["5002:80"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__BookingDb: "Server=db-booking;Database=BookingServiceDb;User Id=sa;Password=@??Anhquang4mat2002??@;TrustServerCertificate=True"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
    depends_on:
      rabbitmq:
        condition: service_healthy
      db-booking:
        condition: service_started

   payment-service:
    build:
      context: .
      dockerfile: src/Services/BookingSystem.PaymentService/Dockerfile
    container_name: booking-payment-service
    ports: ["5003:80"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__PaymentDb: "Server=db-payment;Database=PaymentServiceDb;User Id=sa;Password=@??Anhquang4mat2002??@;TrustServerCertificate=True"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
    depends_on:
      rabbitmq:
        condition: service_healthy
      db-payment:
        condition: service_started

   api-gateway:
    build:
      context: .
      dockerfile: src/BookingSystem.ApiGateway/Dockerfile
    container_name: booking-api-gateway
    ports: ["5000:80"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      - room-service
      - booking-service
      - payment-service
      
      
volumes:
  db-room-data:
  db-booking-data:
  db-payment-data: